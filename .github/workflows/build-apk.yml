name: Build signed APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
permissions:
  contents: write
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HORIZON_TELEMETRY_URL: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK pieces
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          SM="$(command -v sdkmanager || find "$SDK" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SM" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            mkdir -p "$SDK/cmdline-tools"
            mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SM (SDK at $SDK)"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null
          set -o pipefail
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Install Rust target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install Gradle 8.14
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
      - name: Restore signing key (same key every build, so updates install over the old APK)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          mkdir -p .local/android
          echo "$KEYSTORE_B64" | base64 -d > .local/android/debug.keystore
      - name: Prepare engine tables
        run: python3 tools/android_prepare.py
      - name: Build public APK (arm64-v8a)
        run: >
          python3 tools/android_build.py --abi arm64-v8a --public
          --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME"
          --gradle "$HOME/gradle/gradle-8.14/bin/gradle"
      - name: Name the APK
        run: |
          mkdir -p dist
          cp .local/android/apk/arm64-v8a/horizon-android-public.apk dist/Horizons-OptiMobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Horizons-OptiMobile
          path: dist/Horizons-OptiMobile.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/Horizons-OptiMobile.apk --title "Latest build" --notes "Signed with a fixed key, so each new build installs as an update." --target "$GITHUB_SHA"
